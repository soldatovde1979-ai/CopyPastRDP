; ===============================================================================
; setcp.ini — настройки CopyPast (FileTransfer.ps1)
;
; Файл должен лежать рядом с FileTransfer.ps1 (обычно C:\CHANGE\setcp.ini).
; Другой файл можно указать при запуске: FileTransfer.ps1 -Config "путь\к\файлу.ini"
;
; ЛОКАЛЬНЫЕ настройки ЭТОГО контура задаются в файле setcp.local.ini рядом с этим:
; его значения имеют приоритет над setcp.ini, файл НЕ уходит в SyncDir и
; НЕ перезаписывается самообновлением. Так на разных контурах могут действовать
; разные настройки (например, KeepAliveMinutes=1 только на внутреннем).
; Управление без редактирования файла:
;   FileTransfer.ps1 SetLocal <Секция> <Ключ> <Значение>   — записать локальную настройку
;   FileTransfer.ps1 DelLocal <Секция> [Ключ]              — удалить ключ или секцию
;   FileTransfer.ps1 LocalShow                             — показать итоговые настройки
;
; Строки, начинающиеся с ";" или "#" — комментарии (игнорируются).
;
; Секции:
;   [Settings] — числовые параметры и флаги
;   [Paths]    — рабочие каталоги и журнал
;   [Routes]   — маршрутизация принимаемых файлов по маске имени:
;                 Ключ     = маска имени файла (подстановочные знаки PowerShell: * и ?)
;                 Значение = каталог, куда сохранить подошедший файл
;                 Пример:  sppr*.json = C:\Projects\ReportSPPR\examples
;                 Файл, имя которого совпало с маской, сохраняется в указанный
;                 каталог вместо каталога приёма по умолчанию. Каталог создаётся
;                 автоматически. Поддерживаются переменные окружения (%VAR%).
; ===============================================================================

[Settings]
; Порог включения чанкового режима, МБ (до порога включительно — быстрый пакет целиком)
ChunkThresholdMB=10
; Размер одного чанка, МБ
ChunkSizeMB=5
; Предупреждение в журнале, если быстрый пакет больше, МБ
WarningSizeMB=15
; Максимум строк в журнале (при превышении остаются последние N строк).
; 10000 строк ~ неделя истории при heartbeat раз в 60 сек.
MaxLogLines=10000
; Интервал опроса буфера, мс (режим Watch и ожидание ACK)
PollIntervalMs=400
; Число попыток записи чанка в буфер
ClipRetryAttempts=10
; Пауза между попытками записи в буфер, мс
ClipRetryDelayMs=300
; Маршрутизация приёма по маскам из [Routes]: 1 — включена, 0 — выключена
RoutesEnabled=1
; Маски приоритетнее каталога, выбранного вручную (режим UnpackTo): 1/0
RoutesOverrideUnpackTo=1
; Ручной приём (UnpackTo): окно «свежести» файлов в InDir, сек.
; Receive File переносит в выбранную папку файлы, принятые слушателем не позже
; чем N секунд назад (порядок работы: сначала Send на источнике, потом Receive File).
ManualReceiveWindowSec=300

; === Синхронизация папки между контурами (режим Watch) ===
; 1 — слушатель следит за папкой SyncDir и отправляет новые файлы чанками
;     на тот же относительный путь в другом контуре. Пустые папки передаются
;     отдельным пакетом (FILE_DISK_DIR) и создаются на другом контуре.
;     ВНИМАНИЕ: слушатель должен работать на ОБОИХ контурах.
;     Значение — строго 1 или 0 (любое ненулевое число тоже считается 1).
DiskSyncEnabled=1
; Период сканирования папки синхронизации, мс
SyncPollMs=1000
; Таймаут ожидания ACK при РУЧНОЙ отправке (SEND FILE), сек.
; Для фоновой синхронизации действует SyncAckFastSec (ниже).
SyncAckTimeoutSec=60
; Быстрый ACK фоновой синхронизации, сек. Живой приёмник забирает чанк
; за 1-3 сек, но на медленном RDP-канале чанк 5 МБ переносится дольше —
; при 3 сек пакет отзывался посреди переноса («НЕ ПЕРЕДАНО» при живом приёмнике).
; Не дождались — буфер возвращается, повтор по backoff.
SyncAckFastSec=12
; Сторож простоя: фоновая синхронизация не трогает буфер, пока пользователь
; работает (нет клавише/мыши меньше N секунд). 0 — выключить сторож.
SyncIdleGuardSec=4
; Пакетная отправка: если в очереди синхронизации столько НОВЫХ элементов
; (файлов + папок), они отправляются ОДНИМ ZIP-архивом вместо тысяч отдельных
; пакетов через буфер. 0 — пакетный режим выключен.
; Это лечит «перенос папки на тысячи файлов идёт часами и забивает буфер».
SyncBatchFiles=50
; Backoff после неудачной отправки (слушатель другого контура выключен):
; пауза перед повтором растёт вдвое с каждой попыткой до SyncRetryMaxDelaySec.
; По умолчанию 10 мин → 1 час: канал либо жив, либо дёргать чаще незачем.
SyncRetryDelaySec=600
SyncRetryMaxDelaySec=3600

; === Сохранение RDP-сеанса (режим Watch) ===
; Раз в N минут слушатель эмулирует активность (незаметный сдвиг курсора),
; чтобы сессия не закрылась по таймауту бездействия. 0 — выключено.
; Включайте на ВНУТРЕННЕМ контуре (например, 1).
KeepAliveMinutes=0

; === Самообновление через папку синхронизации (режим Watch) ===
; 1 — принятые в SyncDir файлы FileTransfer.ps1 / setcp.ini применяются в каталог
;     запущенного скрипта, после чего слушатель перезапускается с новым кодом.
;     ВНИМАНИЕ: любой файл с таким именем, появившийся в SyncDir, считается обновлением.
AutoUpdate=1

; === Диагностика слушателя (журнал) ===
; Режим журнала: 0 — только ошибки, предупреждения и конечные статусы операций
; копирования (отправлено/принято); 1 — полный лог: каждый чанк, heartbeat,
; диагностика. Приоритет: аргумент -DebugLevel командной строки -> это значение -> 0.
Debug=0
; Периодическая строка "Watch alive" в журнале: показывает, что слушатель жив,
; что в буфере и через сколько мс ближайшее сканирование папки. 0 — выключено.
; (пишется только при Debug=1)
WatchHeartbeatSec=60
; Подробный trace-режим: запись в журнал КАЖДОГО цикла опроса с причинами
; (пустой буфер, чужой текст, свой пакет, время до скана, пропуск файла:
; уже обработан / занят записью / не отправлен). 1 — включён, 0 — выключен.
; Включайте для диагностики, когда нужно понять, почему файл не перенёсся.
; Строки TRACE пишутся только при Debug=1.
WatchTrace=0

[Paths]
; Каталог приёма по умолчанию (создаётся автоматически)
InDir=C:\CHANGE\IN
; Каталог исходящих файлов (режим без аргументов и Pack забирают оттуда всё)
OutDir=C:\CHANGE\OUT
; Файл журнала
LogFile=C:\CHANGE\FileTransfer.log
; Папка синхронизации между контурами (создаётся автоматически при DiskSyncEnabled=1)
; На обоих контурах путь должен совпадать.
SyncDir=C:\CHANGE\disk

[Routes]
; Маска имени файла = каталог назначения.
; Секция перечитывается при КАЖДОМ приёме пакета: правки маршрутов
; (в т.ч. кириллица и пробелы в масках) подхватываются на лету,
; перезапуск слушателя не нужен.
sppr*.json=C:\Projects\ReportSPPR\examples
; report_*.xlsx=C:\Projects\Reports\Inbox
; *_archive.zip=%USERPROFILE%\Downloads

[Tools]
; Папка со gw-proxy (node): кнопка «gw-proxy: запустить/остановить» появляется
; в дашборде, только если здесь есть gw-proxy.cmd. Пусто — кнопки нет.
ZooDir=C:\opencoder\ZOO
