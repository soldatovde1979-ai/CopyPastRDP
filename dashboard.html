<!DOCTYPE html><html><head><meta charset='utf-8'>
<title>CopyPast — {MACHINE}</title><style>
html,body{height:100%;margin:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#171a21;color:#dfe3ea;display:flex;flex-direction:column;overflow:hidden;padding:0 16px}
.card{background:#232833;border-radius:8px;padding:8px 14px;margin-bottom:8px}
.st{font-size:14px;font-weight:600}.on{color:#5fd86b}.off{color:#ff6b6b}
.btn{border:0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#fff;margin-left:6px}
.stop{background:#a33}.start{background:#2d7d46}
.tool{background:#2d3a4d}.tool.warn{background:#7a4a1d}
.sub{color:#8a93a5;font-size:12px;font-weight:400}
.sep{color:#3a4356;margin:0 8px}
.grp{display:inline-flex;align-items:center;gap:4px}
.num{width:44px;background:#171a21;border:1px solid #3a4356;border-radius:6px;color:#dfe3ea;padding:4px;font-size:12px}
#note{margin-left:8px}
/* Компактная drop-строка */
#drop{border:1px dashed #3a4356;border-radius:8px;background:#232833;padding:6px 14px;margin-bottom:8px;text-align:center;color:#8a93a5;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px}
#drop.over{border-color:#7cc7ff;color:#7cc7ff}
#drop button{margin:0}
/* Командер: две панели */
.cmd{flex:1 1 55%;display:flex;gap:8px;min-height:220px;margin-bottom:8px}
.panel{flex:1;display:flex;flex-direction:column;background:#232833;border-radius:8px;min-width:0}
.phead{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid #262b35}
.phead b{font-size:13px}
.phead .btn{padding:3px 8px;font-size:11px;margin-left:0}
.pbody{flex:1;overflow-y:auto;padding:4px 8px}
.crumb{font-size:12px;color:#8a93a5;cursor:pointer}.crumb a{color:#7cc7ff;cursor:pointer;text-decoration:none}
.row{display:flex;align-items:center;gap:6px;padding:2px 6px;font-size:13px;border-radius:4px;cursor:pointer}
.row:hover{background:#2c3342}
.row .ic{width:16px;text-align:center}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{color:#8a93a5;font-size:11px;white-space:nowrap}
.row.dir .nm{color:#e8c268;cursor:pointer}
.row.dir.cur{background:#33405a}
.row.file .nm{color:#dfe3ea;cursor:pointer}
.row .fav{color:#5a6373;cursor:pointer;padding:0 4px}
.row .fav:hover{color:#e8c268}
.row input[type=checkbox]{margin:0}
/* Прогресс передач внутри командера */
#transfers{margin-bottom:8px}
.prow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.ptitle{white-space:nowrap;color:#9aa3b2}
.pbar{flex:1;height:6px;background:#171a21;border-radius:3px;overflow:hidden}
.pfill{height:100%;background:#4a90d9;border-radius:3px}
/* Лог + очередь + параметры */
.cols{flex:1 1 30%;display:flex;gap:8px;min-height:140px;margin-bottom:12px}
.leftcol{flex:1 1 62%;display:flex;flex-direction:column;min-width:0;gap:8px}
.logwrap{flex:1 1 auto;overflow-y:auto;background:#232833;border-radius:8px;padding:4px 12px 10px}
.queuewrap{flex:0 0 30%;display:flex;flex-direction:column;overflow:hidden;margin-bottom:0;padding:6px 10px}
#settings{flex:0 0 300px;overflow-y:auto;margin-bottom:0}
#settings label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
#settings .pname{color:#9aa3b2;font-size:12px}
#settings input[type=number],#settings select{width:90px;background:#171a21;border:1px solid #3a4356;border-radius:6px;color:#dfe3ea;padding:4px;font-size:12px}
table{border-collapse:collapse;width:100%}td{padding:2px 8px;border-bottom:1px solid #262b35;font-size:12px;vertical-align:top}
th{text-align:left;color:#8a93a5;font-size:11px;padding:4px 8px;position:sticky;top:0;background:#232833}
td:first-child{white-space:nowrap;color:#8a93a5}
tr.svc td:nth-child(2){color:#9aa3b2}tr.warn td:nth-child(2){color:#e8c268}tr.bad td:nth-child(2){color:#ff8080}
</style></head><body>
<div class="card topbar">{STATUS}</div>
<div id="transfers">{PROGRESS}</div>
<div id="drop">&#128230; перетащите файлы/папки
<input type="file" id="pickfiles" multiple style="display:none">
<input type="file" id="pickdir" webkitdirectory multiple style="display:none">
<label class="sub" style="cursor:pointer"><input type="checkbox" id="senddirect"> отправить сразу (мимо disk, по маршрутам)</label>
<button class="btn tool" onclick="event.stopPropagation();document.getElementById('pickfiles').click()">Выбрать файлы</button>
<button class="btn tool" onclick="event.stopPropagation();document.getElementById('pickdir').click()">Папка</button>
<span class="sub">крупное — лучше архивом</span></div>
<div class="cmd">
<div class="panel">
<div class="phead"><b>disk (этот ПК)</b>
<button class='btn tool' onclick="cmd('copy','loc')" title="Копировать отмеченное на другой ПК">Копировать</button>
<button class='btn tool' onclick="cmd('move','loc')" title="Переместить: копия на другой ПК, оригинал — в бэкап TEMP">Переместить</button>
<button class='btn stop' onclick="cmd('del','loc')" title="Удалить отмеченное локально (бэкап в TEMP)">Удалить</button>
<label class="sub"><input type="checkbox" id="selall_loc" onchange="selAll(this,'loc')"> все</label>
<span class="sub" id="locinfo"></span></div>
<div class="pbody" id="locbody"></div>
</div>
<div class="panel">
<div class="panel">
<div class="phead"><b>Другой ПК</b> <span id="reminfo" class="sub"></span>
<button class='btn tool' onclick="location.href='/refresh-remote'" title="Обновить список">&#8635;</button>
<button class='btn tool' onclick="cmd('copy','rem')" title="Копировать отмеченное на этот ПК">Копировать</button>
<button class='btn tool' onclick="cmd('move','rem')" title="Переместить: копия сюда, у другого ПК — удаление">Переместить</button>
<button class='btn stop' onclick="cmd('del','rem')" title="Удалить отмеченное у другого ПК">Удалить</button>
<label class="sub"><input type="checkbox" id="selall_rem" onchange="selAll(this,'rem')"> все</label></div>
<div class="pbody" id="rembody"></div>
</div>
</div>
<div class="cols">
<div class="leftcol">
<div class="logwrap"><table>
<tr><th>Время</th><th>Событие</th></tr>
<tbody id="logbody">{ROWS}</tbody>
</table></div>
<div class="card" style="flex:0 0 30%;display:flex;flex-direction:column;overflow:hidden;margin-bottom:0;padding:6px 10px">
<div class='sub' style='padding:2px 0'>Очередь disk (не отправлено) <button class='btn tool' style='padding:1px 8px;font-size:11px' onclick="sendAll()">Отправить всё</button> <button class='btn stop' style='padding:1px 8px;font-size:11px' onclick="clearQueue()">Очистить</button></div>
<div id="queuepanel" style="overflow-y:auto">{QUEUE}</div>
</div>
</div>
{SETTINGS}
</div>
<script>
var uploading = false;
// Живое обновление БЕЗ перезагрузки страницы: /state отдаёт только лог,
// статусы и прогресс — командер не дёргается. Перезагрузка осталась только
// на явные действия (кнопки) и на время загрузки файлов.
setInterval(function(){ if (uploading) return;
  fetch('/state').then(function(r){ return r.json(); }).then(function(s){
    var el;
    if ((el = document.getElementById('stListen'))) el.innerHTML = s.listen;
    if ((el = document.getElementById('queuepanel'))) el.innerHTML = s.queuefiles;
    if ((el = document.getElementById('stRemote'))) el.innerHTML = s.remote;
    if ((el = document.getElementById('transfers'))) el.innerHTML = s.progress;
    if ((el = document.getElementById('logbody'))) el.innerHTML = s.rows;
  }).catch(function(){});
}, 3000);
function sendAll(){
  if (!confirm('Отправить ВСЮ очередь на другой ПК?')) return;
  fetch('/cmd', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'panel=loc&op=sendall&paths='})
    .then(function(){ location.reload(); });
}
function clearQueue(){
  if (!confirm('Очистить очередь? Файлы останутся на disk, но будут помечены как отправленные - синхронизация их больше не отправит.')) return;
  fetch('/clearqueue', {method:'POST'}).then(function(){ location.reload(); });
}
function post(p){ fetch(p,{method:'POST'}).then(function(){ location.reload(); }); }
function note(msg){ var el=document.getElementById('note'); el.textContent=msg; setTimeout(function(){ el.textContent=''; }, 6000); }
function copyLog(){
  var n = document.getElementById('copyn').value || 10;
  fetch('/copylog?n='+n).then(function(r){ return r.text(); }).then(function(t){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function(){ note('Скопировано: '+n+' событий'); });
    } else {
      var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); note('Скопировано: '+n+' событий');
    }
  });
}
// ===== КОМАНДЕР =====
function human(b){ if(b<=0) return ''; if(b<1024) return b+' Б'; if(b<1048576) return (b/1024).toFixed(1)+' КБ'; return (b/1048576).toFixed(1)+' МБ'; }
function stKey(side){ return 'cp.'+side; }
function getFolder(side){ try { return localStorage.getItem(stKey(side)) || ''; } catch(e){ return ''; } }
function setFolder(side, v){ try { localStorage.setItem(stKey(side), v); } catch(e){} }
function renderPanel(side, data){
  var cur = getFolder(side);
  var body = document.getElementById(side+'body');
  body.innerHTML = '';
  // «..» — подъём на уровень вверх. Локальная панель поднимается до корня
  // диска C:\ (из disk — в родительскую папку SyncDir), удалёнка — в пределах disk.
  var isRootDisk = !cur;
  var atDriveRoot = side === 'loc' && cur === 'C:';
  if (!atDriveRoot && (!isRootDisk || side === 'loc')) {
    var up = document.createElement('div'); up.className='row dir';
    up.innerHTML = "<span class='ic'>&#8617;</span><span class='nm'>..</span>";
    up.onclick = function(){
      var target;
      if (isRootDisk) { target = parentOfRoot(); }        // из disk — выше SyncDir, к C:\
      else { var pp = cur.split('/'); pp.pop(); target = pp.join('/'); }
      nav(side, target);
    };
    body.appendChild(up);
  }
  // хлебные крошки: клик по сегменту — переход (автообновление сохранит папку).
  // Локальная панель: C:/ > CHANGE > disk; вне disk первый сегмент — корень диска.
  var cr = document.createElement('div'); cr.className='crumb';
  var parts = cur ? cur.split('/') : [];
  var h;
  if (!cur) h = "<a onclick=\"nav('"+side+"','')\">disk/</a>";
  else if (side === 'loc') h = "<a onclick=\"nav('"+side+"','C:')\">C:/</a>";
  else h = "<a onclick=\"nav('"+side+"','')\">disk/</a>";
  var acc = '';
  for (var i=0;i<parts.length;i++){ acc += (acc?'/':'')+parts[i];
    var label = (side === 'loc' && parts[i] === 'C:') ? 'C:/' : parts[i]+'/';
    h += " <a onclick=\"nav('"+side+"','"+acc+"')\">"+label+"</a>"; }
  cr.innerHTML = h;
  body.appendChild(cr);
  // избранное этой панели: ★ папка · клик — переход, ✕ — убрать (строка видна всегда)
  var favs = getFav().filter(function(x){ return x.side === side; });
  var fh = document.createElement('div'); fh.className='crumb'; fh.style.paddingBottom='4px';
  fh.innerHTML = "<span class='sub'>&#9733; Избранное: </span>";
  if (!favs.length) fh.innerHTML += "<span class='sub'>пусто — ☆ у папки добавляет</span>";
  favs.forEach(function(x){
    var a = document.createElement('a'); a.style.cursor='pointer'; a.title=x.rel;
    a.textContent = x.rel.split('/').pop() || x.rel;
    a.onclick = function(){ nav(side, x.rel); };
    fh.appendChild(a);
    var del = document.createElement('a'); del.textContent='\u2715'; del.style.cursor='pointer'; del.title='Убрать';
    del.onclick = function(e){ e.stopPropagation(); delFav(getFav().indexOf(x)); renderAll(); };
    fh.appendChild(del); fh.appendChild(document.createTextNode('  '));
  });
  body.appendChild(fh);
  // entries текущей папки
  var dirs = {}, files = [];
  for (var i=0;i<data.length;i++){
    var p = data[i].split('|'); var rel = p[0], t = p[2];
    if (cur && rel.indexOf(cur+'/') !== 0) continue;
    var rest = cur ? rel.slice(cur.length+1) : rel;
    if (!rest) continue;
    var slash = rest.indexOf('/');
    if (slash >= 0) { dirs[rest.slice(0, slash)] = 1; }
    else if (t === 'd') dirs[rest] = 2;
    else files.push({n: rest, s: parseInt(p[1])||0, rel: rel});
  }
  var dk = Object.keys(dirs).sort();
  dk.forEach(function(d){
    var r = document.createElement('div'); r.className='row dir';
    r.innerHTML = "<span class='ic'>&#128193;</span><span class='nm'></span><span class='fav' title='В избранное'>&#9734;</span>";
    r.querySelector('.nm').textContent = d;
    var fpath = cur ? cur+'/'+d : d;
    r.onclick = function(){ nav(side, fpath); };
    r.querySelector('.fav').onclick = function(e){ e.stopPropagation(); addFav(side, fpath); };
    body.appendChild(r);
  });
  files.sort(function(a,b){ return a.n.localeCompare(b.n); });
  files.forEach(function(f){
    var r = document.createElement('div'); r.className='row file';
    r.innerHTML = "<input type='checkbox'><span class='ic'>&#128196;</span><span class='nm'></span><span class='sz'></span>";
    r.querySelector('.nm').textContent = f.n;
    r.querySelector('.sz').textContent = human(f.s);
    var cb = r.querySelector('input'); cb.dataset.rel = f.rel;
    cb.addEventListener('click', function(e){ e.stopPropagation(); });
    var nm = r.querySelector('.nm');
    nm.title = f.rel;
    nm.onclick = function(){ fetch('/open?rel='+encodeURIComponent(f.rel)); };
    body.appendChild(r);
  });
}
function nav(side, p){
  setFolder(side, p);
  if (side === 'loc') { loadLoc(); } else { renderPanel('rem', REM||[]); }
}
// ===== ИЗБРАННОЕ (localStorage) =====
function getFav(){ try { return JSON.parse(localStorage.getItem('cp.fav') || '[]'); } catch(e){ return []; } }
function setFav(f){ try { localStorage.setItem('cp.fav', JSON.stringify(f)); } catch(e){} }
function addFav(side, rel){
  var f = getFav();
  if (f.some(function(x){ return x.side === side && x.rel === rel; })) { note('Уже в избранном'); return; }
  f.push({side: side, rel: rel});
  setFav(f); renderAll();
}
function delFav(i){ var f = getFav(); f.splice(i, 1); setFav(f); renderAll(); }
function renderFav(){
  var body = document.getElementById('favbody');
  var f = getFav();
  body.innerHTML = '';
  if (!f.length) { body.innerHTML = "<div class='sub' style='padding:6px'>Пусто — ⭐ у папки</div>"; return; }
  f.forEach(function(x, i){
    var r = document.createElement('div'); r.className='row file';
    r.innerHTML = "<span class='ic'>" + (x.side === 'loc' ? '&#128421;' : '&#127760;') + "</span><span class='nm' style='cursor:pointer'></span><span class='sz' style='cursor:pointer'>&#10005;</span>";
    r.querySelector('.nm').textContent = x.rel;
    r.querySelector('.nm').title = x.rel + ' — ' + (x.side === 'loc' ? 'этот ПК' : 'другой ПК');
    r.querySelector('.nm').onclick = function(){ setFolder(x.side, x.rel); renderAll(); };
    r.querySelector('.sz').onclick = function(){ delFav(i); };
    body.appendChild(r);
  });
}
var LOC=null, REM=null, SYNCROOT='';
// Родитель корня disk за пределами SyncDir: C:\CHANGE\disk -> C:/CHANGE
function parentOfRoot(){
  var n = (SYNCROOT||'').replace(/\\/g,'/').replace(/\/+$/,'');
  var i = n.lastIndexOf('/');
  return i > 0 ? n.slice(0, i) : 'C:';
}
function renderAll(){
  renderPanel('loc', LOC||[]);
  renderPanel('rem', REM||[]);
}
function loadLoc(){
  // Левая панель при каждом переходе запрашивает содержимое текущей папки:
  // кэша за пределами disk нет, без refetch список пуст до F5
  fetch('/files?panel=local&path=' + encodeURIComponent(getFolder('loc'))).then(function(r){return r.json();}).then(function(j){
    LOC = j.files||[];
    SYNCROOT = (j.root||'').replace(/\\/g,'/').replace(/\/+$/,'');
    var mi = document.getElementById('locinfo'); if (mi) mi.textContent = (LOC.length>=3000?'3000+':LOC.length)+' эл.';
    renderPanel('loc', LOC);
  });
}
function loadRem(){
  fetch('/files?panel=remote').then(function(r){return r.json();}).then(function(j){
    REM = j.files || [];
    var mi = document.getElementById('reminfo');
    if (mi) mi.textContent = j.machine ? (j.machine + (j.time ? ' · '+j.time : '')) : 'нет данных';
    renderPanel('rem', REM);
  }).catch(function(){ var mi=document.getElementById('reminfo'); if (mi) mi.textContent='нет данных'; renderPanel('rem', []); });
}
function loadPanels(){ loadLoc(); loadRem(); }
function selAll(chk, side){
  var body = document.getElementById(side+'body');
  body.querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked = chk.checked; });
}
function checkedPaths(side){
  var body = document.getElementById(side+'body');
  var out = [];
  body.querySelectorAll('input[type=checkbox]:checked').forEach(function(c){ if (c.dataset.rel) out.push(c.dataset.rel); });
  return out;
}
function cmd(op, side){
  var paths = checkedPaths(side);
  if (!paths.length) { note('Ничего не отмечено'); return; }
  var what;
  if (op === 'copy')      what = side==='loc' ? 'Копировать отмеченное на другой ПК' : 'Запросить отмеченное у другого ПК';
  else if (op === 'move') what = side==='loc' ? 'Переместить: копия на другой ПК, оригинал — в бэкап TEMP' : 'Переместить: копия сюда, у другого ПК будет удалено';
  else                    what = side==='loc' ? 'Удалить отмеченное локально (бэкап в TEMP)' : 'Удалить отмеченное у другого ПК';
  if (!confirm(what + ' ('+paths.length+' эл.)?')) return;
  var body = 'panel='+encodeURIComponent(side)+'&op='+encodeURIComponent(op)+'&paths='+encodeURIComponent(paths.join('\n'));
  fetch('/cmd', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body})
    .then(function(){ location.reload(); });
}
// Drag&drop: файлы и папки (webkitGetAsEntry), сохраняется структура
function walkEntry(entry, base, out, done){
  if (entry.isFile) {
    entry.file(function(f){ out.push({file:f, path: base + f.name}); done(); }, done);
  } else if (entry.isDirectory) {
    var rd = entry.createReader();
    (function readNext(){
      rd.readEntries(function(entries){
        if (!entries.length) return done();
        var n = entries.length;
        entries.forEach(function(e){ walkEntry(e, base + entry.name + '/', out, function(){ if (--n === 0) done(); }); });
        readNext();
      }, done);
    })();
  } else done();
}
function uploadList(list){
  if (!list.length) return;
  var immediate = document.getElementById('senddirect').checked;
  uploading = true;
  var dz = document.getElementById('drop');
  var pending = list.length;
  dz.innerHTML = immediate ? 'Прямая отправка... ' + pending + ' файл(ов)' : 'Передача в SyncDir... ' + pending + ' файл(ов)';
  list.forEach(function(item){
    var r = new FileReader();
    r.onload = function(){
      var xhr = new XMLHttpRequest();
      xhr.open('POST', immediate ? '/sendnow' : '/drop', true);
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.onload = xhr.onerror = function(){
        pending--;
        if (pending > 0) dz.innerHTML = 'Осталось ' + pending;
        else { uploading = false; location.reload(); }
      };
      xhr.send(JSON.stringify({name: item.file.name, path: item.path, data: r.result.split(',')[1]}));
    };
    r.readAsDataURL(item.file);
  });
}
var dz = document.getElementById('drop');
dz.addEventListener('dragover', function(e){e.preventDefault(); dz.classList.add('over')});
dz.addEventListener('dragleave', function(e){dz.classList.remove('over')});
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('over');
  var items = e.dataTransfer.items;
  var files = e.dataTransfer.files;
  if (files.length && (!items || !items.length)) uploadList(Array.prototype.map.call(files, function(f){ return {file:f, path:f.name}; }));
  else if (items.length) {
    var out = [], n = items.length;
    for (var i = 0; i < n; i++) {
      (function(it){
        var e = it.webkitGetAsEntry && it.webkitGetAsEntry();
        if (e) walkEntry(e, '', out, function(){ if (--n === 0) uploadList(out); });
        else if (--n === 0) uploadList(out);
      })(items[i]);
    }
  }
});
document.getElementById('pickfiles').addEventListener('change', function(e){
  uploadList(Array.prototype.map.call(e.target.files, function(f){ return {file:f, path:f.name}; }));
});
document.getElementById('pickdir').addEventListener('change', function(e){
  var out = [];
  Array.prototype.forEach.call(e.target.files, function(f){
    out.push({file:f, path: f.webkitRelativePath || f.name});
  });
  uploadList(out);
});
loadPanels();
</script></body></html>
